[package]
name = "paper-reel-stock"
version = "1.0.0"
description = "Paper Reel Stock — standalone offline reel manager"
authors = ["elafanto"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paper_reel_stock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2" }
tauri-plugin-log = "2"
