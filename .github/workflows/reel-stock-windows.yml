name: Paper Reel Stock (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'reel-stock-app/**'
      - '.github/workflows/reel-stock-windows.yml'
  pull_request:
    paths:
      - 'reel-stock-app/**'
      - '.github/workflows/reel-stock-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reel-stock-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: reel-stock-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: reel-stock-app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows bundles (NSIS + MSI)
        run: npm run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: paper-reel-stock-windows-nsis
          path: reel-stock-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: paper-reel-stock-windows-msi
          path: reel-stock-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
